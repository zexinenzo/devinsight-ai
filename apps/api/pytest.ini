[pytest]
testpaths = tests
asyncio_mode = auto
# pytest-asyncio 在没有显式设置时用的是「跟随 fixture 作用域」，而未来版本会改成
# function 并先报一条 deprecation 警告。这里写死成 function，等于把今天的实际行为
# 固定下来——不写的话，将来升级那一次所有异步 fixture 的作用域会静默变化。
# 和 ruff.toml 是同一个道理：默认值不能当契约用。
asyncio_default_fixture_loop_scope = function
addopts = -q
# 让裸 `pytest`（不带 -m）也能 import app：`python -m pytest` 会把 CWD 塞进
# sys.path，而 `pytest` 不会。两种写法都该能跑。
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
