services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: devinsight
      POSTGRES_USER: devinsight
      POSTGRES_PASSWORD: change_me_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devinsight -d devinsight"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
